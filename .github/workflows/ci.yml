name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# En main no se cancela una corrida en curso: podría cortar un despliegue a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Tokens, tipos, pruebas y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tokens sincronizados con tokens.json
        run: node scripts/tokens.mjs --check

      - run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Build prerenderizado
        run: pnpm build

      - name: Navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas e2e sobre el build estático
        run: pnpm exec playwright test

      - name: Artefacto para GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/vertexlabs-web/browser

      - name: Reporte de e2e
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-e2e
          path: playwright-report
          retention-days: 7

  deploy:
    name: Publicar en GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
